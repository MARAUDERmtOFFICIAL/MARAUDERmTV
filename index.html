<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARAUDERmt</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22black%22/%3E%3Cpath%20d%3D%22M50%206%20L92%2050%20L50%2094%20L8%2050%20Z%22%20stroke%3D%22red%22%20stroke-width%3D%225%22%20fill%3D%22none%22/%3E%3Cline%20x1%3D%2250%22%20y1%3D%226%22%20x2%3D%2250%22%20y2%3D%2294%22%20stroke%3D%22red%22%20stroke-width%3D%225%22/%3E%3Cline%20x1%3D%228%22%20y1%3D%2250%22%20x2%3D%2292%22%20y2%3D%2250%22%20stroke%3D%22red%22%20stroke-width%3D%225%22/%3E%3Cpath%20d%3D%22M28%2028%20L50%2050%20L28%2072%22%20stroke%3D%22red%22%20stroke-width%3D%225%22%20fill%3D%22none%22/%3E%3Cpath%20d%3D%22M72%2028%20L50%2050%20L72%2072%22%20stroke%3D%22red%22%20stroke-width%3D%225%22%20fill%3D%22none%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0a0a0a;--line:#3a0000;--text:#fff;--mute:#ff2b2b;--cyan:#ff0000;--pink:#fff;--lime:#ff2b2b;--red-mid:#cc0000;--mono:"Share Tech Mono",ui-monospace,"Courier New",monospace}
*{box-sizing:border-box}
body{margin:0;font:500 1.15rem/1.35 "Big Shoulders Stencil Text",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
main{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto}
.screen,.deck{position:relative;border:1px solid var(--cyan);border-radius:0;padding:10px;background:var(--panel);box-shadow:inset 0 0 40px rgba(255,0,0,.1),0 0 18px rgba(255,0,0,.07)}
.screen video,.screen iframe{display:block;width:100%;aspect-ratio:16/9;background:#000;border:0;border-radius:0;max-height:68vh;filter:var(--f-inv,) var(--f-bw,) var(--f-sepia,) var(--f-con,) var(--f-vivid,) var(--f-faded,) var(--f-night,) var(--f-cool,) var(--f-green,) var(--f-amber,) var(--f-crt,) var(--f-vhs,) var(--f-glow,) var(--f-blur,)}
.screen iframe{display:none}
.fx-bw{--f-bw:grayscale(1)}
.fx-sepia{--f-sepia:sepia(.85)}
.fx-contrast{--f-con:contrast(1.35) saturate(1.2)}
.fx-crt{--f-crt:contrast(1.1) saturate(1.15) brightness(1.05)}
.fx-vhs{--f-vhs:saturate(1.4) blur(.5px) hue-rotate(-6deg)}
.fx-invert{--f-inv:invert(1) hue-rotate(180deg)}
.fx-vivid{--f-vivid:saturate(1.8) contrast(1.1)}
.fx-faded{--f-faded:saturate(.55) contrast(.9) brightness(1.1)}
.fx-night{--f-night:sepia(.4) brightness(.72) saturate(.9)}
.fx-cool{--f-cool:sepia(.3) hue-rotate(170deg) saturate(1.3)}
.fx-green{--f-green:grayscale(1) sepia(1) hue-rotate(65deg) saturate(3)}
.fx-amber{--f-amber:grayscale(1) sepia(1) saturate(3) hue-rotate(-12deg)}
.fx-glow{--f-glow:brightness(1.12) saturate(1.3) drop-shadow(0 0 6px rgba(255,0,0,.55))}
.fx-blur{--f-blur:blur(1.2px)}
.fx-mirror video,.fx-mirror iframe{transform:scaleX(-1)}
.fx-mask .l-mask{display:block;opacity:.3;mix-blend-mode:multiply;background:repeating-linear-gradient(90deg,#f00 0 1px,#0f0 1px 2px,#00f 2px 3px)}
.layers{position:absolute;inset:10px;border-radius:0;overflow:hidden;pointer-events:none;z-index:2}
.layers i{position:absolute;inset:0;display:none}
.fx-scan .l-scan,.fx-crt .l-scan{display:block;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
.fx-vig .l-vig,.fx-crt .l-vig{display:block;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.fx-grain .l-grain{display:block;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");animation:grain .6s steps(1) infinite}
.fx-vhs .l-vhs{display:block;background:linear-gradient(90deg,rgba(255,0,60,.07),transparent 25%,transparent 75%,rgba(0,200,255,.07))}
.fx-vhs .l-vhs::after{content:"";position:absolute;left:0;right:0;height:14%;background:linear-gradient(transparent,rgba(255,255,255,.1),transparent);animation:roll 5s linear infinite}
.fx-crt .l-flick{display:block;background:#fff;opacity:.03;animation:flick .12s steps(2) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-40px 30px}50%{background-position:30px -50px}75%{background-position:-20px -20px}100%{background-position:50px 40px}}
@keyframes roll{from{transform:translateY(-100%)}to{transform:translateY(800%)}}
@keyframes flick{0%{opacity:.01}100%{opacity:.06}}
@media (prefers-reduced-motion:reduce){.l-grain,.l-vhs::after,.l-flick{animation:none!important}}
.fxbar{display:flex;flex-direction:column;gap:8px}
.fxpanel{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:0;background:var(--panel)}
.fxpanel[hidden]{display:none}
.fxgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#fxtoggle{align-self:flex-start;border-color:var(--cyan);color:var(--cyan);border-radius:0;padding:4px 14px;text-shadow:0 0 8px rgba(255,0,0,.6)}
.fxbar span{color:var(--mute);margin-right:4px}
.fxbar button{all:unset;cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:0;color:var(--mute)}
.fxbar button:hover{color:var(--text);border-color:var(--cyan)}
.fxbar button[aria-pressed=true]{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(255,0,0,.5);text-shadow:0 0 8px var(--cyan)}
.fxbar button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.deck{display:none;padding:22px 16px}
.deck audio{display:block;width:100%;color-scheme:dark}
#now{color:var(--lime);min-height:1.4em;text-shadow:0 0 8px rgba(255,43,43,.6)}
#now::before{content:"> "}
#now::after{content:"\2588";margin-left:4px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
small{color:var(--mute);font-size:1rem}
aside{background:var(--panel);border-left:2px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:-8px 0 30px rgba(255,0,0,.06)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:2px solid var(--line)}
.tabs button{all:unset;text-align:center;padding:12px 4px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;font-family:inherit;font-size:1.05rem}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{color:var(--pink);border-bottom-color:var(--pink);text-shadow:0 0 8px var(--pink);box-shadow:0 8px 14px -10px var(--pink)}
.tabs button:focus-visible{outline:2px solid var(--cyan);outline-offset:-3px}
.ctl{padding:12px;display:grid;gap:10px;border-bottom:2px solid var(--line)}
select,input{width:100%;padding:9px 10px;border-radius:0;border:1px solid var(--cyan);background:#050000;color:var(--text);font:inherit;box-shadow:inset 0 0 10px rgba(255,0,0,.12)}
select:focus,input:focus{outline:none;box-shadow:0 0 12px rgba(255,0,0,.7),inset 0 0 10px rgba(255,0,0,.2)}
option,optgroup{background:#050000;color:var(--text)}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;scrollbar-color:var(--cyan) var(--panel)}
li{position:relative}
li .main{all:unset;display:block;width:100%;padding:9px 46px 9px 30px;cursor:pointer;border-bottom:1px solid var(--line);box-sizing:border-box;position:relative}
li .main:hover,li .main:focus-visible{background:#1a0000;color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
li .main:hover::before,li .main:focus-visible::before,li.on .main::before{content:">";position:absolute;left:12px;color:var(--pink)}
li.on .main{color:var(--pink);text-shadow:0 0 8px var(--pink);background:#2a0000}
li .main:focus-visible{outline:1px dashed var(--cyan);outline-offset:-3px}
#avail{all:unset;cursor:pointer;text-align:center;padding:8px 10px;border:1px solid var(--lime);border-radius:0;color:var(--lime);box-shadow:inset 0 0 10px rgba(255,43,43,.1)}
#avail:hover{box-shadow:0 0 12px rgba(255,43,43,.6)}
#avail[aria-pressed=true]{background:rgba(255,43,43,.15);text-shadow:0 0 8px var(--lime)}
#avail:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#next{position:absolute;right:26px;bottom:66px;z-index:3;padding:10px 16px;border:1px solid var(--pink);border-radius:0;background:rgba(0,0,0,.9);color:var(--pink);font:inherit;cursor:pointer;box-shadow:0 0 14px rgba(255,0,0,.6);text-shadow:0 0 8px var(--pink)}
#next:hover,#next:focus-visible{background:rgba(255,0,0,.22);outline:2px solid var(--cyan)}
#next[hidden]{display:none}
.star{all:unset;position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--mute);font-size:1.4rem;line-height:1;padding:4px 6px;border-radius:0}
.star:hover{color:var(--pink);text-shadow:0 0 8px var(--pink)}
.star[aria-pressed=true]{color:var(--lime);text-shadow:0 0 8px var(--lime)}
.star:focus-visible{outline:2px solid var(--cyan)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools[hidden]{display:none}
.tools button{all:unset;cursor:pointer;padding:3px 12px;border:1px solid var(--pink);border-radius:0;color:var(--pink)}
.tools button:hover{background:rgba(255,0,0,.18)}
.tools button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.livebar{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;display:flex;align-items:center;gap:10px;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.88));border-radius:0}
.livebar[hidden]{display:none}
.deck .livebar{position:static;padding:0;background:none}
.lb,.livetag{all:unset;cursor:pointer;color:var(--cyan);padding:2px 10px;border:1px solid var(--cyan);border-radius:0;}
.lb:hover{background:rgba(255,0,0,.15)}
.lb:disabled{opacity:.35;cursor:default}
.lb:disabled:hover{background:none}
.livetag.behind{color:var(--lime);border-color:var(--lime);text-shadow:0 0 8px var(--lime)}
.livetag.behind:hover{background:rgba(255,43,43,.15)}
.livetag{margin-left:auto;color:#ff2b2b;border-color:#ff2b2b;text-shadow:0 0 8px #ff2b2b}
.livetag:hover{background:rgba(255,43,43,.15)}
.lb:focus-visible,.livetag:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.livebar input[type=range]{width:90px;padding:0;border:0;background:none;box-shadow:none;accent-color:var(--cyan)}
.screen:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0;border:0;padding:0;background:#000}
.screen:fullscreen video,.screen:fullscreen iframe{max-height:100vh;height:100%;object-fit:contain;border-radius:0}
.screen:fullscreen .layers{inset:0;border-radius:0}
.screen:fullscreen .livebar{left:16px;right:16px;bottom:16px}
.screen:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border-radius:0;border:0;padding:0;background:#000}
.screen:-webkit-full-screen video,.screen:-webkit-full-screen iframe{max-height:100vh;height:100%;object-fit:contain;border-radius:0}
.screen:-webkit-full-screen .layers{inset:0;border-radius:0}
.msg{padding:14px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#now::after{animation:none}}
@media (max-width:760px){body{height:auto;min-height:100vh}.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-left:0;border-top:2px solid var(--line);max-height:60vh}main{overflow:visible}}

/* ===== MARAUDERmt: red / black / white terminal, stencil + mono ===== */
h1{margin:0;font-weight:inherit}
.marauder-header{border-bottom:2px solid var(--cyan);background:#000;padding:18px 14px 14px;text-align:center;position:relative;flex:none;box-shadow:0 0 24px rgba(255,0,0,.14),inset 0 -10px 30px rgba(255,0,0,.04)}
.marauder-header:before,.marauder-header:after{content:"";position:absolute;top:10px;bottom:10px;width:18px;border-top:1px solid var(--cyan);border-bottom:1px solid var(--cyan)}
.marauder-header:before{left:10px;border-left:2px solid var(--cyan)}
.marauder-header:after{right:10px;border-right:2px solid var(--cyan)}
.top-emblem{width:42px;height:42px;margin:0 auto 6px;display:block;filter:drop-shadow(0 0 8px rgba(255,0,0,.55))}
.top-emblem path,.top-emblem line{stroke:var(--cyan);stroke-width:2;fill:none}
.marauder-name{font:700 clamp(28px,6vw,52px)/.95 "Big Shoulders Stencil Text",sans-serif;letter-spacing:8px;color:#fff;text-shadow:2px 2px 0 #3a0000,0 0 14px rgba(255,0,0,.75),0 0 34px rgba(255,0,0,.35);animation:mdrGlow 3.6s ease-in-out infinite}
@keyframes mdrGlow{0%,100%{text-shadow:2px 2px 0 #3a0000,0 0 14px rgba(255,0,0,.75),0 0 34px rgba(255,0,0,.35)}50%{text-shadow:2px 2px 0 #3a0000,0 0 22px rgba(255,0,0,.95),0 0 50px rgba(255,0,0,.55)}}
.marauder-sub{margin-top:6px;color:var(--mute);font:9px var(--mono);letter-spacing:4px;text-transform:uppercase}
.mil-clock{display:inline-flex;justify-content:center;margin-top:10px;padding:5px 18px;min-width:170px;border:2px solid var(--cyan);background:#050000;color:#fff;font:700 clamp(22px,4.5vw,32px)/1 "Big Shoulders Stencil Text",sans-serif;letter-spacing:4px;text-shadow:2px 2px 0 #300000,0 0 9px rgba(255,0,0,.55);box-shadow:inset 0 0 0 1px #5c0000,0 0 14px rgba(255,0,0,.18)}
.mil-clock-label{margin-top:4px;font:7px var(--mono);letter-spacing:3px;color:var(--mute)}
.stencil-corner{position:absolute;width:9px;height:9px;border-color:#fff;opacity:.7}
.stencil-corner.tl{left:16px;top:16px;border-top:1px solid;border-left:1px solid}
.stencil-corner.tr{right:16px;top:16px;border-top:1px solid;border-right:1px solid}
.stencil-corner.bl{left:16px;bottom:16px;border-bottom:1px solid;border-left:1px solid}
.stencil-corner.br{right:16px;bottom:16px;border-bottom:1px solid;border-right:1px solid}
.top-bar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--cyan);font:11px var(--mono);letter-spacing:1.5px;text-transform:uppercase}
.top-bar .bright{color:#fff;font-weight:bold}.top-bar .dim{color:var(--mute)}
.blinkdot{display:inline-block;width:6px;height:6px;background:var(--cyan);border-radius:50%;margin-right:6px;animation:pulse 1.4s infinite;box-shadow:0 0 10px var(--cyan),0 0 22px rgba(255,0,0,.5)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.bracket{position:absolute;width:18px;height:18px;border-color:var(--cyan);z-index:5;pointer-events:none;box-shadow:0 0 6px rgba(255,0,0,.5);animation:mdrBracketPulse 3.2s ease-in-out infinite}
.bracket.tl{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
.bracket.tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid}
.bracket.bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid}
.bracket.br{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}
@keyframes mdrBracketPulse{0%,100%{opacity:1}50%{opacity:.45}}
.panel-head{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:1px solid var(--red-mid);border-bottom:0;background:var(--panel);font:600 10px var(--mono);letter-spacing:2px;text-transform:uppercase}
.panel-head .bright{color:#fff}.panel-head .dim{color:var(--mute)}
.panel-head::after{content:"";position:absolute;left:-30%;top:0;bottom:0;width:30%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,0,0,.35),transparent);mix-blend-mode:screen;animation:mdrSweep 5s linear infinite}
@keyframes mdrSweep{0%{left:-30%}100%{left:100%}}
.stage-head{margin-bottom:-12px}
aside .panel-head{border-width:0 0 1px;border-color:var(--red-mid)}
/* CRT scanlines + faint grid */
body::before{content:"";position:fixed;inset:0;z-index:5000;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,0,0,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen;opacity:.5}
body::after{content:"";position:fixed;inset:0;z-index:4999;pointer-events:none;background-image:linear-gradient(rgba(255,0,40,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,40,.05) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 72%)}
/* mono utility face for readouts */
#now,small,input,select,option,optgroup,.livebar,.lb,.livetag,#fxtoggle,.fxbar span,.fxbar button,#avail,.msg{font-family:var(--mono)}
#now,small,.fxbar button,#avail,#fxtoggle,.lb,.livetag{font-size:.8rem;letter-spacing:.06em}
select,input{font-size:.85rem}
.tabs button{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--cyan);text-shadow:0 0 8px rgba(255,0,0,.9);box-shadow:0 8px 14px -10px var(--cyan)}
li .main{letter-spacing:.03em}
li .main:hover,li .main:focus-visible{background:rgba(255,0,0,.08);color:#fff;text-shadow:none;box-shadow:inset 3px 0 0 var(--cyan)}
li .main:hover::before,li .main:focus-visible::before,li.on .main::before{color:var(--cyan)}
li.on .main{color:#fff;background:#2a0000;box-shadow:inset 3px 0 0 var(--cyan);text-shadow:0 0 8px rgba(255,0,0,.8)}
#now{color:#fff;text-shadow:0 0 8px rgba(255,0,0,.7)}
#now::before{color:var(--cyan)}
#fxtoggle,#avail,#next,.lb,.tools button{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#fxtoggle{color:#fff;border-color:var(--cyan);text-shadow:none}
#avail{border-color:var(--cyan);color:#fff;box-shadow:inset 0 0 10px rgba(255,0,0,.12)}
#avail:hover{box-shadow:0 0 12px rgba(255,0,0,.6)}
#avail[aria-pressed=true]{background:rgba(255,0,0,.22);text-shadow:0 0 8px var(--cyan)}
#next{border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(255,0,0,.6);text-shadow:none}
#next:hover,#next:focus-visible{background:rgba(255,0,0,.3);outline:2px solid #fff}
.tools button{border-color:var(--cyan);color:#fff}.tools button:hover{background:rgba(255,0,0,.25)}
.livetag.behind{color:#fff;border-color:#fff;text-shadow:0 0 8px rgba(255,255,255,.6)}
.star[aria-pressed=true]{color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
input:focus,select:focus{box-shadow:0 0 0 1px var(--cyan),0 0 10px rgba(255,0,0,.6)}
.footer-note{text-align:center;font:9px var(--mono);letter-spacing:1px;color:var(--mute)}
@media (max-width:760px){.top-bar{flex-direction:column;align-items:flex-start;gap:4px}}
@media (prefers-reduced-motion:reduce){.marauder-name,.panel-head::after,.bracket,.blinkdot,body::before{animation:none!important}}

/* live bar: just the LIVE tag + fullscreen button, tucked top-right so the native progress bar stays free */
.livebar{left:auto;right:18px;top:18px;bottom:auto;padding:0;background:none;gap:8px}
.deck .livebar{position:static;padding:0;margin-top:8px;justify-content:flex-end}
.screen:fullscreen .livebar{left:auto;right:18px;top:18px;bottom:auto}
.screen:-webkit-full-screen .livebar{left:auto;right:18px;top:18px;bottom:auto}
.livebar .lb{background:rgba(0,0,0,.7)}
.screen video::-webkit-media-controls-fullscreen-button{display:none}
/* filters + overlays are on .screen, so fullscreen the whole .screen and they carry over */
.screen:fullscreen .layers{z-index:2}
.subinfo{font:.8rem var(--mono);letter-spacing:.06em;color:var(--mute);margin:2px 0 4px}
.subinfo:empty{display:none}
.screen video::cue{background:rgba(0,0,0,.78);color:#fff;font-family:"Share Tech Mono",ui-monospace,monospace}
#grp{font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-color:var(--cyan)}
#grp[hidden]{display:none}
</style>
</head>
<body>
<header class="marauder-header">
  <span class="stencil-corner tl"></span><span class="stencil-corner tr"></span><span class="stencil-corner bl"></span><span class="stencil-corner br"></span>

async function countOf(val){
  if(probeCache.has(val))return probeCache.get(val);
  const i=val.indexOf(":"),src=val.slice(0,i),key=val.slice(i+1);
  let n=null;
  try{
    if(src==="ia"){
      const [col,extra]=key.split("~");
      const query=`collection:${col} AND mediatype:movies`+(extra?` AND ${extra}`:"");
      const r=await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&rows=0&output=json`);
      if(r.ok)n=(await r.json()).response.numFound;
    }else if(src==="nasa"){
      const r=await fetch("https://images-api.nasa.gov/search?media_type=video&page_size=1&q="+encodeURIComponent(key));
      if(r.ok)n=(await r.json()).collection.metadata.total_hits;
    }else if(src==="wm"){
      const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=6&srlimit=1&srinfo=totalhits&srprop=&srsearch="+encodeURIComponent("filetype:video "+key));
      if(r.ok)n=((await r.json()).query.searchinfo||{}).totalhits;
    }else if(src==="iptvf"&&key.includes("~")){
      const [path,flag]=key.split("~");
      let t=m3uCache.get(path);
      if(!t){const r=await fetch(IPTV+path+".m3u");if(r.ok){t=await r.text();m3uCache.set(path,t)}}
      if(t)n=applyFlag(parseM3U(t),flag).length;
    }
  }catch(e){}
  if(typeof n==="number")probeCache.set(val,n);else n=null;
  return n;
}

function parseM3U(txt){
  const out=[],L=txt.split(/\r?\n/);
  for(let i=0;i<L.length;i++){
    if(!L[i].startsWith("#EXTINF"))continue;
    const q=L[i].lastIndexOf('",'),name=(q>=0?L[i].slice(q+2):L[i].split(",").slice(1).join(",")).trim();
    let j=i+1,ref,ua;
    while(j<L.length&&(L[j].startsWith("#")||!L[j].trim())){
      let m;
      if(m=L[j].match(/^#EXTVLCOPT:http-referrer=(.+)/i))ref=m[1].trim();
      if(m=L[j].match(/^#EXTVLCOPT:http-user-agent=(.+)/i))ua=m[1].trim();
      j++;
    }
    const url=(L[j]||"").trim();
    if(/^https?:/.test(url)&&!/(youtube\.com|youtu\.be)\//i.test(url))out.push({name,url,ref,ua});
  }

}

function explain(d){

  if(code===404||code===410)return `the stream address no longer exists (HTTP ${code}).`;
  if(code>=500)return `the stream's server is having problems (HTTP ${code}).`;
  if(d.type==="networkError"||/manifestLoad/.test(d.details||""))return "the browser could not reach the stream. The server may block web players (CORS), block your network or region, or be offline.";
  return "playback failed ("+(d.details||"unknown error")+").";
}

  bar.hidden=el===$("v")?false:!live;
}
const FXG=[
  ["Colour",[["bw","Black & white"],["sepia","Sepia"],["contrast","High contrast"],["vivid","Vivid"],["faded","Faded"],["invert","Invert"],["night","Night"],["cool","Cool tint"],["green","Green phosphor"],["amber","Amber mono"]]],
  ["Effects",[["scan","Scanlines"],["vig","Vignette"],["crt","CRT"],["grain","Film grain"],["vhs","VHS"],["mask","Pixel mask"],["glow","Neon glow"],["blur","Soft blur"],["mirror","Mirror"]]]
];
const FX=FXG.flatMap(g=>g[1]);
let fx=new Set(),fxOpen=false;
try{fx=new Set(JSON.parse(localStorage.getItem("freetv:fx")||"[]").filter(k=>FX.some(f=>f[0]===k)))}catch(e){}
function applyFx(){
  $("screen").className="screen"+[...fx].map(k=>" fx-"+k).join("");
  document.querySelectorAll("#fxpanel button[data-fx]").forEach(b=>{const k=b.dataset.fx;b.setAttribute("aria-pressed",k==="none"?fx.size===0:fx.has(k))});
  const t=$("fxtoggle");
  t.setAttribute("aria-expanded",String(fxOpen));
  t.textContent="Video filters"+(fx.size?` (${fx.size} on)`:"")+(fxOpen?" \u25B4":" \u25BE");
  $("fxpanel").hidden=!fxOpen;
  try{localStorage.setItem("freetv:fx",JSON.stringify([...fx]))}catch(e){}
}
(function(){
  const bar=$("fxbar"),t=document.createElement("button");
  t.id="fxtoggle";t.type="button";t.setAttribute("aria-controls","fxpanel");
  t.onclick=()=>{fxOpen=!fxOpen;applyFx()};
  const panel=document.createElement("div");panel.id="fxpanel";panel.className="fxpanel";
  const mk=(parent,k,n)=>{
    const b=document.createElement("button");b.type="button";b.dataset.fx=k;b.textContent=n;
    b.onclick=()=>{if(k==="none")fx.clear();else if(fx.has(k))fx.delete(k);else fx.add(k);applyFx()};
    parent.appendChild(b);
  };
  const top=document.createElement("div");top.className="fxgroup";mk(top,"none","None");panel.appendChild(top);
  FXG.forEach(([g,items])=>{
    const row=document.createElement("div"),l=document.createElement("span");
    row.className="fxgroup";l.textContent=g+":";row.appendChild(l);
    items.forEach(([k,n])=>mk(row,k,n));panel.appendChild(row);
  });
  bar.append(t,panel);applyFx();
})();
setSection("tv");
(function(){const c=$("clock"),p=n=>String(n).padStart(2,"0");const t=()=>{const d=new Date();c.textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())};t();setInterval(t,1000)})();
</script>
</body>
